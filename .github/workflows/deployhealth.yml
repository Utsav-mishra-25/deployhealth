# deployhealth scans itself: the published CLI reports this repo's env var findings to the hosted
# instance on every push to main, like any other project's Action.
name: deployhealth

# Push events only. The token is a secret, so never run this on pull_request events from forks.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  env-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Nothing is installed, so no cache. setup-node v5 enables one by default when package.json
          # has a packageManager field, then fails because pnpm isn't on the runner.
          package-manager-cache: false
      - name: Scan env vars and report to deployhealth
        env:
          DEPLOYHEALTH_TOKEN: ${{ secrets.DEPLOYHEALTH_TOKEN }}
        # No --exclude or --ignore, like `pnpm scan:self`: the CLI skips NODE_ENV and the scanner's
        # test fixtures by default.
        run: |
          npx --yes deployhealth-scan@0.3.1 \
            --url https://deployhealth.dev \
            --token "$DEPLOYHEALTH_TOKEN" \
            --sha "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME"
