# Publishes packages/core/npm (deployhealth-scan) to npm with a provenance attestation.
# Manual only: Actions → Publish CLI → Run workflow, after bumping the version in
# packages/core/npm/package.json and packages/core/src/version.ts. Not in use yet: releases are
# published by hand. How to switch: docs/architecture/ingest-and-cli.md ("Switching to the workflow").
#
# Two jobs: `build` installs, tests and packs with no id-token permission; `publish` gets only the
# packed npm/ directory as an artifact, runs behind the protected `npm-publish` environment, and is
# the only job that can mint an OIDC token. Every action is pinned by full commit SHA (the version
# is in the comment, resolved with `git ls-remote --tags`), and the npm CLI by exact version.
name: Publish CLI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deployhealth/core test
      - run: pnpm --filter @deployhealth/core build:npm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: packages/core/npm/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Protection rules (required reviewer, deployment branch main) are set on GitHub, not here.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing, which also signs the provenance
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.0 # exact; trusted publishing needs 11.5.1 or later
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: npm
      - run: npm publish --provenance
        working-directory: npm
