name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: deployhealth
          POSTGRES_PASSWORD: deployhealth
          POSTGRES_DB: deployhealth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deployhealth"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://deployhealth:deployhealth@localhost:5432/deployhealth_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Production runs Postgres 18 and so does the service above; the backup test's pg_dump and
      # pg_restore must be at least the server's major version (the runner ships 16), so the 18
      # client comes from the PostgreSQL project's apt repository, first on PATH.
      - name: PostgreSQL 18 client (pg_dump, pg_restore)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: pg_dump version
        run: pg_dump --version && pg_restore --version
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  # Playwright on a production build (`next build` + `next start`), against a freshly migrated and
  # seeded database. Chromium is downloaded each run; traces are uploaded only when a test fails.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: deployhealth
          POSTGRES_PASSWORD: deployhealth
          POSTGRES_DB: deployhealth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deployhealth"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://deployhealth:deployhealth@localhost:5432/deployhealth
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @deployhealth/web exec playwright install --with-deps chromium
      - name: Migrate
        run: pnpm db:migrate
      - name: A throwaway AUTH_SECRET for this run
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: e2e (builds, then runs Playwright against next start)
        run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
