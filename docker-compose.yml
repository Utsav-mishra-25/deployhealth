# Local Postgres for development and tests: `docker compose up -d`
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: deployhealth
      POSTGRES_PASSWORD: deployhealth
      POSTGRES_DB: deployhealth
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18/docker: mount the parent. A new volume
      # name, because 18 can't read the data directory the old postgres:16 volume holds.
      - pgdata18:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployhealth"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata18:
